name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────
  # Stage 1: Build bridge-server standalone binary per platform
  # ─────────────────────────────────────────────────────────
  build-sidecar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
            pkg-target: node18-win-x64
            ext: .exe
          - os: macos-latest
            target-triple: aarch64-apple-darwin
            pkg-target: node18-macos-arm64
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bridge-to-fig/shared build

      - name: Bundle bridge-server with esbuild
        run: pnpm --filter @bridge-to-fig/server bundle

      - name: Compile sidecar binary with pkg
        shell: bash
        run: |
          npx --yes @yao-pkg/pkg \
            bridge-server/dist/bundle.cjs \
            --target ${{ matrix.pkg-target }} \
            --output bridge-server-${{ matrix.target-triple }}${{ matrix.ext }} \
            --compress GZip

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target-triple }}
          path: bridge-server-${{ matrix.target-triple }}${{ matrix.ext }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Stage 1b: Package the Figma plugin (independent of the desktop build)
  # ─────────────────────────────────────────────────────────
  build-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sets BRIDGE_RELEASE=1, which is the only thing that strips the version
      # suffix from the plugin name. See docs/community-build.md.
      - name: Build the plugin with release naming
        run: pnpm build:plugin:release

      # A plain `build:plugin` would ship a manifest named "Bridge to Fig v… (dev)",
      # and enablePrivatePluginApi in a public build is a Community rejection.
      - name: Verify the manifest is a release build
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=figma-plugin/dist/manifest.json
          NAME=$(jq -r '.name' "$MANIFEST")
          ID=$(jq -r '.id' "$MANIFEST")
          PRIVATE_API=$(jq -r 'has("enablePrivatePluginApi")' "$MANIFEST")

          if [ "$NAME" != "Bridge to Fig" ]; then
            echo "manifest name is \"$NAME\", expected \"Bridge to Fig\" — did BRIDGE_RELEASE get lost?"
            exit 1
          fi
          if ! [[ "$ID" =~ ^[0-9]+$ ]]; then
            echo "manifest id is \"$ID\", expected the numeric Figma-issued id"
            exit 1
          fi
          if [ "$PRIVATE_API" != "false" ]; then
            echo "enablePrivatePluginApi must not be set in a public build"
            exit 1
          fi
          echo "manifest ok: $NAME ($ID)"

      # Only these four files matter to Figma — ui.js is inlined into ui.html at
      # build time and would just confuse anyone opening the archive.
      - name: Package the plugin
        run: |
          cd figma-plugin/dist
          zip -X ../../Bridge-to-Fig-Figma-Plugin.zip manifest.json code.js ui.html icon.svg
          cd ../..
          unzip -l Bridge-to-Fig-Figma-Plugin.zip

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: figma-plugin
          path: Bridge-to-Fig-Figma-Plugin.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Stage 2: Build Tauri app per platform
  # ─────────────────────────────────────────────────────────
  build-tauri:
    needs: build-sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
            rust-target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target-triple: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # figma-plugin/dist is a build artifact and is gitignored, so it does not exist on a fresh
      # checkout. Build it before Tauri compiles: the desktop app embeds the directory, so an
      # installer built without this step ships with no plugin inside it.
      - name: Build the Figma plugin for embedding
        run: pnpm build:plugin:release

      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target-triple }}
          path: desktop/src-tauri/binaries/

      - name: Prepare sidecar binary
        shell: bash
        run: |
          cd desktop/src-tauri/binaries
          # Tauri expects: binaries/{name}-{target-triple}{ext}
          # The artifact is already named correctly from the build stage
          # Make executable on Unix
          if [ "${{ matrix.ext }}" = "" ]; then
            chmod +x bridge-server-${{ matrix.target-triple }}
          fi
          ls -la

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Write certificate
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing (macOS only — ignored on other platforms)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.rust-target }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Bridge to Fig ${{ github.ref_name }}'
          releaseBody: |
            See the [documentation](https://github.com/Brooksmade/Bridge-to-Fig#readme) for details.

            **Two downloads, and you need both.** The desktop app runs the bridge server on your machine; the plugin runs inside Figma and talks to it.

            - `Bridge-to-Fig-Windows.exe` / `Bridge-to-Fig-macOS.dmg` — the desktop app
            - `Bridge-to-Fig-Figma-Plugin.zip` — the Figma plugin. Unzip it, then in Figma go to **Plugins → Development → Import plugin from manifest** and pick the `manifest.json` inside.

            > **Windows users:** You may see a SmartScreen warning — click "More info" then "Run anyway". The app is open-source and safe to install.
          releaseDraft: true
          prerelease: false

  # ─────────────────────────────────────────────────────────
  # Stage 3: Attach the Figma plugin bundle to the release
  #
  # The release is created by tauri-action in stage 2, so this has to wait for
  # it even though the plugin itself builds independently.
  # ─────────────────────────────────────────────────────────
  attach-plugin:
    needs: [build-plugin, build-tauri]
    # Deliberately does NOT require build-tauri to succeed. build-tauri is a matrix, so one platform
    # failing marks the whole need 'failure' even though the other already created the release and
    # uploaded its installers. The plugin is platform-independent and should land on that release
    # regardless. It still waits on build-tauri, because that is what creates the release.
    if: ${{ !cancelled() && needs.build-plugin.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: figma-plugin

      - name: Upload the plugin to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}"
          ASSET="Bridge-to-Fig-Figma-Plugin.zip"

          # Draft releases aren't on /releases/tags/ — query all releases and filter
          RELEASE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API}/releases" | jq -c ".[] | select(.tag_name == \"${TAG}\")" | head -1)

          if [ -z "${RELEASE}" ]; then
            # A manual workflow_dispatch on a branch has no release to attach to.
            # On a tag push there must be one, so treat that as a failure.
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "No release found for tag ${TAG}"
              exit 1
            fi
            echo "No release for ${TAG} (not a tag build) — skipping"
            exit 0
          fi

          RELEASE_ID=$(echo "${RELEASE}" | jq -r '.id')
          echo "Found release ID: ${RELEASE_ID} for tag ${TAG}"

          # Re-runs would otherwise 422 on the duplicate name
          EXISTING=$(echo "${RELEASE}" | jq -r --arg n "${ASSET}" '.assets[] | select(.name == $n) | .id')
          if [ -n "${EXISTING}" ]; then
            echo "Removing previous ${ASSET} (asset ${EXISTING})"
            curl -sf -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" \
              "${API}/releases/assets/${EXISTING}" > /dev/null
          fi

          echo "Uploading ${ASSET} ($(wc -c < "${ASSET}") bytes)"
          curl -sf -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ASSET}" \
            "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${ASSET}" \
            | jq -r '"Uploaded: " + .name + " (" + (.size|tostring) + " bytes)"'

  # ─────────────────────────────────────────────────────────
  # Stage 4: Rename release assets to user-friendly names
  # ─────────────────────────────────────────────────────────
  rename-assets:
    # Runs after attach-plugin so a single pass sees every asset, including the plugin zip.
    needs: [build-tauri, attach-plugin]
    # Same reasoning as attach-plugin: one platform failing must not leave the platform that
    # succeeded with raw Tauri filenames. The rename map is what produces the stable
    # /releases/latest/download/ names the plugin's download button links to, so skipping it
    # silently 404s that button. Assets that are not present are simply not renamed.
    if: ${{ !cancelled() && needs.build-tauri.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}"

          # Draft releases aren't on /releases/tags/ — query all releases and filter
          RELEASE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API}/releases" | jq -c ".[] | select(.tag_name == \"${TAG}\")" | head -1)

          if [ -z "${RELEASE}" ]; then
            echo "No release found for tag ${TAG}"
            exit 0
          fi

          RELEASE_ID=$(echo "${RELEASE}" | jq -r '.id')
          echo "Found release ID: ${RELEASE_ID} for tag ${TAG}"

          # Define rename map: pattern → new name (no version in name so /latest/download/ works)
          declare -A RENAME_MAP=(
            ["_x64-setup.exe"]="Bridge-to-Fig-Windows.exe"
            ["_x64-setup.exe.sig"]="Bridge-to-Fig-Windows.exe.sig"
            ["_aarch64.dmg"]="Bridge-to-Fig-macOS.dmg"
            ["_aarch64.dmg.sig"]="Bridge-to-Fig-macOS.dmg.sig"
          )

          # Get all assets and rename
          echo "${RELEASE}" | jq -c '.assets[] | {id: .id, name: .name}' | while read -r ASSET; do
            ASSET_ID=$(echo "${ASSET}" | jq -r '.id')
            ASSET_NAME=$(echo "${ASSET}" | jq -r '.name')

            NEW_NAME=""
            for PATTERN in "${!RENAME_MAP[@]}"; do
              if [[ "${ASSET_NAME}" == *"${PATTERN}" ]]; then
                NEW_NAME="${RENAME_MAP[${PATTERN}]}"
                break
              fi
            done

            if [ -n "${NEW_NAME}" ] && [ "${NEW_NAME}" != "${ASSET_NAME}" ]; then
              echo "Renaming: ${ASSET_NAME} → ${NEW_NAME}"
              curl -s -X PATCH \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"${NEW_NAME}\"}" \
                "${API}/releases/assets/${ASSET_ID}" > /dev/null
            fi
          done

          echo "Asset renaming complete"
